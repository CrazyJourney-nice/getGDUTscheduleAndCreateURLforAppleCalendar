@ -0,0 +1,41 @@
name: Auto Update Class Schedule

on:
  schedule:
    # 每天凌晨 22:00 (UTC 时间)，即北京时间早上 6:00 自动运行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许你手动点击按钮触发运行

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ics pycryptodome rich

      - name: Run Fetcher Script
        env:
          # 从 GitHub Secrets 中读取你的学号和密码
          GDUT_USERNAME: ${{ secrets.GDUT_USERNAME }}
          GDUT_PASSWORD: ${{ secrets.GDUT_PASSWORD }}
        run: python get_your_scheduleAppleCalendarURL.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          destination_dir: .