name: Auto Update Class Schedule

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ics pycryptodome rich

      - name: Debug Environment Variables
        env:
          U_CHECK: ${{ secrets.GDUT_USERNAME }}
          P_CHECK: ${{ secrets.GDUT_PASSWORD }}
        run: |
          if [ -z "$U_CHECK" ]; then echo "!!! GDUT_USERNAME is MISSING in Secrets !!!"; else echo "GDUT_USERNAME is set."; fi
          if [ -z "$P_CHECK" ]; then echo "!!! GDUT_PASSWORD is MISSING in Secrets !!!"; else echo "GDUT_PASSWORD is set."; fi

      - name: Run Fetcher Script
        env:
          GDUT_USERNAME: ${{ secrets.GDUT_USERNAME }}
          GDUT_PASSWORD: ${{ secrets.GDUT_PASSWORD }}
        run: python get_your_scheduleAppleCalendarURL.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          destination_dir: .
